<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ooxmlgen demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; font-size: 15px; background: #f5f5f5; color: #222; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 32px; width: 100%; max-width: 560px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 28px; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 14px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; color: #444; }
    .optional { font-weight: 400; color: #999; }
    input[type="text"], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; font-family: inherit; color: #222; background: #fafafa; transition: border-color 0.15s; }
    input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: #2E74B5; background: #fff; }
    textarea { resize: vertical; min-height: 110px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .checkbox-row label { margin: 0; cursor: pointer; font-weight: 400; color: #333; }
    .divider { border: none; border-top: 1px solid #eee; margin: 22px 0; }
    button[type="submit"] { width: 100%; padding: 10px; background: #2E74B5; color: #fff; border: none; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    button[type="submit"]:hover { background: #1f5a8f; }
    button[type="submit"]:disabled { background: #aaa; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 13px; min-height: 20px; text-align: center; }
    .status.ok { color: #2a7a2a; }
    .status.err { color: #c0392b; }
    .scope-note { margin-top: 22px; padding: 10px 12px; background: #f0f4fa; border-left: 3px solid #2E74B5; border-radius: 0 4px 4px 0; font-size: 12px; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ooxmlgen demo</h1>
    <p class="subtitle">Temporary manual test harness</p>
    <form id="form">
      <p class="section-label">Content</p>
      <div class="field"><label for="title">Document title</label><input type="text" id="title" name="title" value="My Document"></div>
      <div class="field"><label for="heading">Heading <span class="optional">(optional)</span></label><input type="text" id="heading" name="heading" placeholder="Section heading"></div>
      <div class="field"><label for="body">Body text</label><textarea id="body" name="body">This document was generated by ooxmlgen.

Arabic example: مرحبا بالعالم (Hello World)</textarea></div>
      <div class="field"><label for="footnote">Footnote <span class="optional">(optional)</span></label><input type="text" id="footnote" name="footnote" placeholder="e.g. See ECMA-376 5th edition"></div>
      <hr class="divider">
      <p class="section-label">Typography</p>
      <div class="row2">
        <div class="field"><label for="fontFamily">Font family</label><select id="fontFamily" name="fontFamily"><option value="Calibri" selected>Calibri</option><option value="Times New Roman">Times New Roman</option><option value="Arial">Arial</option><option value="Arial Unicode MS">Arial Unicode MS</option><option value="Traditional Arabic">Traditional Arabic</option></select></div>
        <div class="field"><label for="fontSize">Font size</label><select id="fontSize" name="fontSize"><option value="10">10 pt</option><option value="11" selected>11 pt</option><option value="12">12 pt</option><option value="14">14 pt</option><option value="16">16 pt</option></select></div>
      </div>
      <hr class="divider">
      <p class="section-label">Layout</p>
      <div class="field"><div class="checkbox-row"><input type="checkbox" id="rtl" name="rtl"><label for="rtl">RTL layout (right-to-left, Arabic/Hebrew)</label></div></div>
      <div class="field"><div class="checkbox-row"><input type="checkbox" id="pageBreak" name="pageBreak"><label for="pageBreak">Insert page break before body text</label></div></div>
      <hr class="divider">
      <p class="section-label">Header / Footer</p>
      <div class="field"><label for="headerType">Header type</label><select id="headerType" name="headerType"><option value="none">None</option><option value="default">Default (all pages)</option><option value="firstDiff">First page different</option><option value="evenOdd">Even / Odd pages</option></select></div>
      <div class="field"><div class="checkbox-row"><input type="checkbox" id="pageNumbering" name="pageNumbering"><label for="pageNumbering">Add page numbering in footer</label></div></div>
      <hr class="divider">
      <button type="submit" id="btn">Export to .docx</button>
      <p class="status" id="status"></p>
    </form>
    <div class="scope-note"><strong>Scope:</strong> title, heading, paragraphs, footnotes, font family/size, RTL/Arabic, page numbering, header types, A4 page setup.</div>
  </div>
  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); btn.disabled = true; status.textContent = 'Generating...'; status.className = 'status';
      try {
        const res = await fetch('/generate', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(new FormData(form)).toString() });
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob(); const url = URL.createObjectURL(blob); const a = document.createElement('a');
        const m = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
        a.href = url; a.download = m ? m[1] : 'document.docx';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        status.textContent = 'Downloaded ' + a.download; status.className = 'status ok';
      } catch (err) { status.textContent = 'Error: ' + err.message; status.className = 'status err'; }
      finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
